# LuxuryForm Studio v1 — Phase 2
# Backend (FastAPI + build123d geometry) + frontend (vite dev server, three.js
# viewport).
#
# Start:   docker compose up --build -d
# Stop:    docker compose down
# Logs:    docker compose logs -f backend   (or: frontend)
#
# Backend API:  http://localhost:8000/api/health
# Viewport UI:  http://localhost:5173
services:
  backend:
    build:
      context: .
      # Plan B (ADR-017/018): if deb.debian.org AND all Debian mirrors are
      # unreachable but Docker Hub works, build a donor variant instead.
      # HYBRID (recommended — pinned python:3.11-trixie donor + 3 local
      # GL debs in ./debs/; no third-party distro):
      #   set BACKEND_DOCKERFILE=Dockerfile.hybrid   (cmd)
      #   docker compose build backend && docker compose up -d backend
      # GENERIC (fallback — any single donor image):
      #   set BACKEND_DOCKERFILE=Dockerfile.donor
      #   set GL_DONOR_IMAGE=eclipse-temurin:21-jdk-noble   (or your donor)
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        # Package index for pip inside the image build (default PyPI).
        # Override once for your shell, then build as usual, e.g. Git Bash:
        #   export PIP_INDEX_URL=https://your.mirror/simple
        #   docker compose up --build -d
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # Debian pool base URL for the 9 pinned system-library debs
        # (ADR-017; sha256-pinned, so the mirror is pure transport).
        # Default: a DATED snapshot.debian.org archive — live pools rotate,
        # the snapshot serves these exact versions permanently:
        #   set DEB_POOL_URL=https://your.mirror/debian/pool/main/
        DEB_POOL_URL: ${DEB_POOL_URL:-https://snapshot.debian.org/archive/debian/20260803T082142Z/pool/main/}
        # Plan B donor image (only used by Dockerfile.donor):
        GL_DONOR_IMAGE: ${GL_DONOR_IMAGE:-eclipse-temurin:21-jdk-noble}
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data

  frontend:
    # node_modules is baked into the image at BUILD time (frontend/Dockerfile,
    # ADR-013) in cache-protected layers — no npm ci at container start.
    # No bind mount: a host-side node_modules (possibly corrupt from a killed
    # start-time install) must never shadow the image's own.
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
