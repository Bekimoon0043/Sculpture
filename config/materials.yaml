# materials.yaml — LuxuryForm Studio v1 starter material library
# Real, fabrication-grade starter set for LuxuryCon's typical palette.
# Units are explicit in every field name (Rule 6: unitless numbers are a bug).
#
# min_wall_mm / max_wall_mm form the per-material WALL ENVELOPE (ADR-027):
# the range of basin/dish wall thickness LuxuryCon's workshop will actually
# fabricate in that material. These are WORKSHOP envelopes — set by the
# fabricator (the operator), tunable here, NOT citations of an external
# standard. The registry enforces them as hard constraint 2 with real
# numbers in every violation. Basis for each ceiling is noted inline.
#
# min_clearance_mm is the per-material FALL-GAP FLOOR (ADR-029): the
# smallest free gap the workshop will build between the widest dish rim and
# the basin inner wall. NOTE THE UNIT CONVENTION — min_clearance_mm is
# DIAMETRAL (it is subtracted from a diameter), so the physical radial gap
# is HALF this number. Same status as the wall envelopes: workshop values
# set by the fabricator, tunable here, not standard citations.
#
# Why a floor > 0 exists at all (computed, not recalled): at clearance 0 the
# widest dish rim is exactly TANGENT to the basin inner wall. The fused
# solid then carries coincident surfaces and tessellates to a mesh that is
# not watertight — this is not theory, it failed the live gate on
# 2026-08-09 (watertight=False, basin 2600 = dish 2240 + 2x180 wall). Every
# floor below also clears the 1.0 mm GLB tessellation deflection by >=10x,
# so the preview mesh can never show the two surfaces merged.
#
# Slice A additions (PHASE_6_SLICE_A_ENVELOPES.md, signed as drafted
# 2026-08-20, ADR-032 — same workshop status: fabricator-set, tunable,
# not standard citations):
#
# joint_overlap_mm — the smallest deliberate INTERFERENCE at a mating
# joint (ADR-029 generalised: every joint is a real overlap, never a
# contact; zero is the tangency knife edge). Floor = 2 x per-face
# fabrication tolerance + margin, rounded up. Cross-material joints take
# the MAX of the two floors (rule, enforced in the assembler).
#
# min_feature_mm — smallest projecting detail (rib, fin, step, petal
# thickness) the process reproduces. min_internal_radius_mm — the radius
# the tool actually leaves in an internal corner. The literal "wall"
# means the floor equals the part's wall thickness (316L: a formed sheet
# feature cannot be thinner than the sheet; press-brake inside radius is
# about one material thickness). These two are recorded and validated
# now; the parameters they floor arrive with slices B (rim treatments)
# and C (blade/petal arrays).
materials:
  stainless_316l_sheet:
    name: "316L stainless steel sheet"
    category: metal
    density_kg_per_m3: 8000
    min_wall_mm: 3
    # Sheet envelope: 3 mm weldable floor; 20 mm ceiling — beyond that you
    # are machining plate, not forming sheet, and the stock sheet size no
    # longer applies.
    max_wall_mm: 20
    # Sheet parts are cut, formed and finished BEFORE assembly, so the gap
    # only has to stay open after fit-up: 10 mm radial clears the weld bead
    # (~4 mm proud) plus sheet-forming springback, and passes a hose/brush.
    min_clearance_mm: 20
    # ±0.5 mm per face (laser cut, press formed): 2x0.5=1, floor 3 (3x the
    # 1.0 mm tessellation deflection).
    joint_overlap_mm: 3
    # A formed sheet feature cannot be thinner than the sheet, and the
    # press-brake inside radius is about one material thickness — both
    # floors are the wall thickness itself (formula, not constant).
    min_feature_mm: wall
    min_internal_radius_mm: wall
    stock_size_mm: {length: 3000, width: 1500}
  basalt_slab:
    name: "Basalt slab"
    category: stone
    density_kg_per_m3: 2700
    min_wall_mm: 20
    # Carved-stone envelope: monumental basalt basins want 60-250 mm walls.
    # 250 mm ceiling is mass-driven: a 250 mm wall ring on the largest
    # registry basin (6 m dia x 0.9 m high) is ~pi*(3^2-2.75^2)*0.9*2700
    # ~ 11.0 t — at the edge of handling; the 2.6 m brief's 180 mm
    # wall is ~1.7 t, routine for a stone workshop with a crane.
    max_wall_mm: 250
    # Carved stone: each face carries a few mm of carving tolerance, and two
    # carved faces bound this gap. 20 mm radial keeps a real, visible fall
    # gap after both faces vary, and admits a brush for cleaning scale off
    # the basin wall once installed.
    min_clearance_mm: 40
    # ±3 mm per carved/CNC face: 2x3=6, floor 10 (10x tessellation deflection).
    joint_overlap_mm: 10
    # Monumental carving chips out below 15 mm on a projecting edge.
    min_feature_mm: 15
    # Diamond cup wheel / ball-nose CNC practical minimum.
    min_internal_radius_mm: 10
    stock_size_mm: {length: 2400, width: 1200}
  cast_concrete_c35_45:
    name: "C35/45 cast concrete"
    category: concrete
    density_kg_per_m3: 2400
    min_wall_mm: 75
    # Cast envelope: 75 mm floor (cover + aggregate size), 300 mm ceiling —
    # thicker sections are mass pours needing thermal control, not shell
    # casting.
    max_wall_mm: 300
    # Coarsest tolerance in the library: formwork deflects and aggregate
    # bulges the face. 25 mm radial is what survives a cast-in-place pour
    # and still reads as a deliberate gap rather than a casting defect.
    min_clearance_mm: 50
    # ±5 mm per face (formwork deflection + aggregate bulge): 2x5=10,
    # floor 15. Flagged on the signed sheet as the least-sure tolerance —
    # if the formwork is better than ±5 mm, lower this floor here.
    joint_overlap_mm: 15
    # Governed by aggregate: C35/45 with 20 mm aggregate cannot reproduce
    # finer detail.
    min_feature_mm: 25
    # Standard formwork corner fillet.
    min_internal_radius_mm: 10
    stock_size_mm: null   # cast in place — no stock sheet/slab size
  bronze_cast:
    name: "Cast bronze"
    category: metal
    density_kg_per_m3: 8800
    min_wall_mm: 6
    # Cast envelope: 6 mm floor (pour fluidity), 40 mm ceiling — thicker
    # sections risk shrinkage porosity and are usually cored instead.
    max_wall_mm: 40
    # Cast and chased before assembly, like the sheet metal: 10 mm radial
    # clears the chasing allowance and passes a hose/brush.
    min_clearance_mm: 20
    # ±1.5 mm per face (cast then chased): 2x1.5=3, floor 5 (5x deflection).
    joint_overlap_mm: 5
    # Casting reproduces fine detail well; chasing recovers the rest.
    min_feature_mm: 2
    # Pattern-maker's fillet.
    min_internal_radius_mm: 3
    stock_size_mm: null   # cast — no stock sheet/slab size
  # SC-A1 (slice SC-A1, the crescent_ring primitive): cast / welded &
  # mirror-polished 316L stainless, the process behind monumental
  # "moon crescent" sculpture. PROVISIONAL workshop envelope — the
  # crescent's chunky tube is cast (or rolled-plate welded) and polished,
  # NOT formed sheet, so the 316L SHEET envelope does not apply.
  # FABRICATOR-INPUT like freeform_loop's prototype values: fabricator-set
  # and tunable here, NOT a citation of an external standard. The 3 mm
  # wall floor and the tolerances are carried from the 316L sheet process
  # (same alloy, same workshop); the 500 mm ceiling is this primitive's
  # own tube_diameter_mm range maximum (a thicker "wall" than 500 mm is
  # not a crescent tube at all — arithmetic, not a citation).
  stainless_316l_cast:
    name: "Cast / welded & mirror-polished 316L stainless"
    category: metal
    density_kg_per_m3: 8000
    min_wall_mm: 3
    max_wall_mm: 500
    min_clearance_mm: 20
    joint_overlap_mm: 3
    min_feature_mm: 3
    min_internal_radius_mm: 5
    stock_size_mm: null   # cast / welded built-up — no stock sheet/slab size
