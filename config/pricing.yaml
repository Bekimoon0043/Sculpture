# pricing.yaml — LuxuryForm Studio v1 (ADR-006: versioned pricing)
#
# OPERATOR: verify against current provider price pages before relying on cost
# numbers; bump pricing_version on every edit.
#
# The prices below are the published list prices as of 2026-07 (best current
# knowledge at build time), EXCEPT kimi-k3 which was fetched from the LIVE
# docs (see entry). They MUST be verified against the providers' live
# price pages before any cost figure is trusted. Every AI call logged in the
# database records the pricing_version that computed its cost, so stale prices
# can never silently rewrite history.
pricing_version: "2026-08-v1"

providers:
  anthropic:
    # https://www.anthropic.com/pricing — Claude Sonnet 4.5 list price
    claude-sonnet-4-5:
      usd_per_1m_input_tokens: 3.00
      usd_per_1m_output_tokens: 15.00
      effective_date: "2025-09-29"
  openai:
    # https://openai.com/api/pricing — GPT-4o list price
    gpt-4o:
      usd_per_1m_input_tokens: 2.50
      usd_per_1m_output_tokens: 10.00
      effective_date: "2024-08-06"
  kimi:
    # Source: https://platform.kimi.ai/docs/pricing/chat-k3.md fetched LIVE
    # 2026-08-01 (ADR-009). Table row: kimi-k3, per 1M tokens —
    # input (cache hit) $0.30, input (cache miss) $3.00, output $15.00,
    # context 1,048,576 tokens. We bill input at the CACHE-MISS rate
    # ($3.00, conservative) since caching is automatic and unpredictable.
    # Vision is the same kimi-k3 model (native image input) — same prices.
    kimi-k3:
      usd_per_1m_input_tokens: 3.00
      usd_per_1m_output_tokens: 15.00
      effective_date: "2026-08-01"
