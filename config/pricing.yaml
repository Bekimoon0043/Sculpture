# pricing.yaml — LuxuryForm Studio v1 (ADR-006: versioned pricing)
#
# OPERATOR: verify against current provider price pages before relying on cost
# numbers; bump pricing_version on every edit.
#
# RE-VERIFIED 2026-08-07 (ADR-021, all three providers, before Phase 3
# provider-touching code):
#   - anthropic: FIRST-PARTY https://platform.claude.com/docs/en/about-claude/pricing
#     fetched 2026-08-07 — Claude Sonnet 4.5 $3/$15 per MTok, UNCHANGED.
#     (Current gen is Claude Sonnet 5 at intro $2/$10 through 2026-08-31 then
#     $3/$15; we stay on claude-sonnet-4-5, still listed and served.)
#   - openai: first-party https://platform.openai.com/docs/pricing fetched
#     2026-08-07 — its current chat table lists the gpt-5.x generation;
#     gpt-4o does NOT appear there. GPT-4o $2.50/$10 (cached $1.25) is
#     corroborated by THREE independent dated trackers (aipricing.guru synced
#     2026-08-07; pricepertoken 2026-08-06; valueaddvc 2026-06-21). Account-level
#     availability is confirmed by models.list() — scripts/live_verify_providers.py
#     (operator runs it; sandbox has no keys).
#   - kimi: FIRST-PARTY https://platform.kimi.ai/docs/pricing/chat-k3.md
#     fetched 2026-08-07 — kimi-k3 $0.30 cache-hit / $3.00 cache-miss input,
#     $15.00 output, context 1,048,576 — UNCHANGED.
#
# ADR-022 (2026-08-07, operator live-verify run): providers now SPLIT input
# into uncached / cache-read / cache-write classes and each class prices
# separately (usage shapes live-verified against the operator's account —
# kimi usage.cached_tokens; anthropic usage.cache_read_input_tokens /
# cache_creation_input_tokens). Cache-class prices below are FIRST-PARTY,
# fetched 2026-08-07:
#   - anthropic (platform.claude.com/docs/en/about-claude/pricing): Sonnet 4.5
#     cache READ $0.30/MTok, 5-minute cache WRITE $3.75/MTok (1h write $6 —
#     the SDK default TTL is 5m; we never request 1h).
#   - kimi (platform.kimi.ai/docs/pricing/chat-k3.md): cache HIT $0.30/MTok.
#   - openai gpt-4o: cached-input $1.25 appears only in third-party trackers,
#     NOT first-party-verified (gpt-4o is absent from the current first-party
#     table) — so openai_provider deliberately does NOT split input; it bills
#     everything at the full $2.50 (conservative; real cost can only be
#     lower). Revisit when the cached rate is first-party-verified.
# PR-2 (ADR-061, 2026-08-28): every model gains context_window_tokens — the
# FIRST-PARTY documented context window that anchors the cap-safe
# reservation bound (Amendment 4 fallback: no provider documents message
# framing overhead, checked 2026-08-28 on the pages cited per model below,
# so bound = context_window x highest input/cache-write rate + max_tokens x
# output rate). B-4 (price re-verification) remains OPEN: these fetches
# confirm context windows and, where shown, the anthropic prices; the
# gpt-4o PRICES are still not first-party-verified.
# Every AI call logged in the database records the pricing_version that
# computed its cost, so stale prices can never silently rewrite history.
pricing_version: "2026-08-v4"

providers:
  anthropic:
    # platform.claude.com/docs/en/about-claude/pricing — Claude Sonnet 4.5 list
    # price, first-party fetched 2026-08-07 (unchanged).
    claude-sonnet-4-5:
      usd_per_1m_input_tokens: 3.00
      usd_per_1m_output_tokens: 15.00
      # First-party cache classes (same page, fetched 2026-08-07):
      usd_per_1m_cached_input_tokens: 0.30        # cache read (0.1x base)
      usd_per_1m_cache_write_input_tokens: 3.75   # 5-minute cache write (1.25x)
      effective_date: "2025-09-29"
      # "Context window: 200K tokens · Max output: 64K tokens" — the model's
      # own first-party page (also re-confirms $3/$15/$0.30/$3.75).
      context_window_tokens: 200000
      context_window_source: "platform.claude.com/docs/en/models/sonnet-4-5/overview fetched 2026-08-28"
  openai:
    # GPT-4o $2.50/$10 — not on the first-party table fetched 2026-08-07
    # (gpt-5.x generation only); corroborated by three independent dated
    # trackers (see header). models.list() verification pending (operator key).
    gpt-4o:
      usd_per_1m_input_tokens: 2.50
      usd_per_1m_output_tokens: 10.00
      effective_date: "2024-08-06"
      # "128,000 context window" / "16,384 max output tokens" — first-party
      # model page (the PRICES above remain tracker-corroborated only; B-4).
      context_window_tokens: 128000
      context_window_source: "developers.openai.com/api/docs/models/gpt-4o fetched 2026-08-28"
  kimi:
    # Source: https://platform.kimi.ai/docs/pricing/chat-k3.md re-fetched LIVE
    # 2026-08-07 (ADR-009/ADR-021). Table row: kimi-k3, per 1M tokens —
    # input (cache hit) $0.30, input (cache miss) $3.00, output $15.00,
    # context 1,048,576 tokens — UNCHANGED since the 2026-08-01 fetch.
    # usage.cached_tokens (live-verified 2026-08-07) is the cache-hit SUBSET
    # of prompt_tokens; the provider splits it and bills each class at its
    # own rate. Vision is the same kimi-k3 model (native image input) —
    # same prices.
    kimi-k3:
      usd_per_1m_input_tokens: 3.00               # cache-MISS input
      usd_per_1m_output_tokens: 15.00
      usd_per_1m_cached_input_tokens: 0.30        # cache-HIT input
      effective_date: "2026-08-01"
      # "1,048,576 tokens" context, re-confirmed with the prices on the same
      # page. CONSEQUENCE (ADR-061, stated honestly): the fallback bound for
      # one kimi-k3 call is ~$3.15 input + output — a kimi dispatch only
      # fits while its run has >= that much headroom under the $5 run cap.
      context_window_tokens: 1048576
      context_window_source: "platform.kimi.ai/docs/pricing/chat-k3.md re-fetched 2026-08-28"
