# council.yaml — LuxuryForm Studio v1
# Council role -> provider assignments, verbatim from the approved
# First Action document section 4. Changeable in one line by the operator.
# Every decision-critical role is servable by at least two providers; the
# three decision-critical roles run on two providers in parallel with the
# Arbiter surfacing material disagreement (never averaging it away).

roles:
  researcher:
    primary: kimi
    parallel: openai
  designer:
    primary: anthropic
    parallel: openai
  geometrist:
    primary: anthropic
    parallel: kimi
  engineer:
    primary: openai
    parallel: anthropic
  critic:
    primary: openai
    parallel: kimi
    # Hard rule (build order section 5): the Critic never runs on the
    # provider that produced the design. Resolved dynamically per session;
    # the primary/parallel above are the static defaults only.
    dynamic_rule: "never same provider as the design's producer"
  arbiter:
    primary: openai
    parallel: anthropic
  vision_critique:
    providers: [anthropic, openai]
    fallback: kimi

# API endpoints per provider (ADR-009: taken from LIVE provider docs, never
# from training-data recall — fetch date recorded). null = SDK default.
# Env overrides: MOONSHOT_BASE_URL for kimi. The previous hardcoded
# https://api.moonshot.cn/v1 caused a live 401 (operator's account is on the
# global endpoint) — endpoints live in config now, not in code.
endpoints:
  anthropic: null   # anthropic SDK default
  openai: null      # openai SDK default
  kimi: https://api.moonshot.ai/v1   # verified live: operator's key
         # authenticates here (2026-07-31); confirmed against
         # platform.kimi.ai/docs/api/overview fetched 2026-08-01

# Default models per provider. OPERATOR: set to a model your account can access.
# `vision` is OPTIONAL: when omitted, the text model is used for vision calls.
model_defaults:
  anthropic:
    text: claude-sonnet-4-5
    vision: claude-sonnet-4-5
  openai:
    text: gpt-4o
    vision: gpt-4o
  kimi:
    text: kimi-k3
    # NO separate vision model: the operator's live models.list() (2026-07-31)
    # returns exactly kimi-k3, kimi-k2.6, kimi-k2.7-code, kimi-k2.7-code-highspeed
    # — no vision-specific model exists on this account. kimi-k3 has NATIVE
    # image input (platform.kimi.ai/docs/guide/use-kimi-vision-model.md,
    # fetched 2026-08-01), so vision calls use the same kimi-k3 model.
