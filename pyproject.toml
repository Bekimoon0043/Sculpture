[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxuryform"
version = "0.2.0"
description = "LuxuryForm Studio v1 - Phase 2: local-first sculpture/fountain design platform for LuxuryCon (Addis Ababa)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
    "anthropic==0.42.0",
    "openai==1.59.3",
    "pillow==11.0.0",
    "jsonschema==4.23.0",
    "pytest==8.3.4",
    # Phase 2 geometry kernel (ADR-010; live-doc verified 2026-08-01)
    "build123d==0.11.1",
    "trimesh==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "jsonschema==4.23.0",
]

# Package layout: the importable package is `app`, located under backend/
# (backend/ is on PYTHONPATH, per SPEC section A).
[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
